name: Publish FNCache runtime image and chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/fncache-project/fncache-agent

jobs:
  publish:
    name: Build and publish runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image digest
        run: |
          {
            echo "### FNCache runtime image"
            echo
            echo '${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package and publish Helm chart
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          helm package charts/oncache \
            --version "${chart_version}" \
            --app-version "${chart_version}" \
            --destination "${RUNNER_TEMP}"
          helm push "${RUNNER_TEMP}/oncache-${chart_version}.tgz" \
            oci://ghcr.io/fncache-project/charts
