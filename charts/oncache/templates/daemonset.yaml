{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oncache.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oncache.labels" . | nindent 4 }}
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "oncache.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oncache.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oncache.serviceAccountName" . }}
      hostNetwork: true
      hostPID: {{ .Values.hostPID }}
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.agent.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.agent.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ONCACHE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: ONCACHE_CONFIG
              value: /etc/oncache/agent.yaml
            - name: ONCACHE_INSTALLATION_ID
              value: {{ default (include "oncache.fullname" .) .Values.agent.installationID | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          securityContext:
            privileged: {{ .Values.security.privileged }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop:
                - ALL
              add:
                {{- toYaml .Values.security.capabilities.add | nindent 16 }}
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: runtime
              mountPath: /host/run
              readOnly: true
            - name: state
              mountPath: /var/lib/oncache
            - name: flannel
              mountPath: /run/flannel
              readOnly: true
            - name: config
              mountPath: /etc/oncache
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
      volumes:
        - name: bpf
          hostPath:
            path: {{ .Values.hostPaths.bpf }}
            type: Directory
        - name: runtime
          hostPath:
            path: {{ .Values.hostPaths.runtime }}
            type: Directory
        - name: state
          hostPath:
            path: {{ .Values.hostPaths.state }}
            type: DirectoryOrCreate
        - name: flannel
          hostPath:
            path: {{ .Values.hostPaths.flannel }}
            type: Directory
        - name: config
          configMap:
            name: {{ include "oncache.fullname" . }}
{{- end }}
