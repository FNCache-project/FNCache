image:
  repository: ghcr.io/fncache-project/fncache-agent
  tag: v0.5.0-pre
  pullPolicy: IfNotPresent

agent:
  enabled: true
  command:
    - /oncache-agent
  args:
    - -config
    - /etc/oncache/agent.yaml
  installationID: ""

config:
  runtimeEndpoint: unix:///run/k3s/containerd/containerd.sock
  pinRoot: /sys/fs/bpf/oncache/v1
  stateDir: /var/lib/oncache/v1
  datapath:
    elfPath: /opt/oncache/bpf/tc_prog_kern.o
    elfBuildID: sha256:dev
  overlay:
    type: flannel-vxlan
    device: auto
    vxlanLinkName: flannel.1
  markers:
    chain: ONCACHE
    comment: ""
    missMask: 0x04
    establishedMask: 0x08
  heartbeat:
    interval: 1s
    timeout: 5s
  kube:
    maxStaleness: 30s
    resyncInterval: 30m
  health:
    interval: 5s
  scan:
    incrementalInterval: 30s
    fullInterval: 5m
  maps:
    ingressCacheMaxEntries: 1024
    egressIPCacheMaxEntries: 4096
    egressCacheMaxEntries: 1024
    policyCacheMaxEntries: 4096
    devMapMaxEntries: 8
  server:
    listenAddress: :9090
  features:
    enabled: true
    debugState: false

rbac:
  create: true
  serviceAccountName: ""

security:
  privileged: false
  capabilities:
    add:
      - BPF
      - NET_ADMIN
      - PERFMON
      - SYS_ADMIN
      - SYS_PTRACE

hostPID: true

hostPaths:
  bpf: /sys/fs/bpf
  containerd: /run/k3s/containerd
  state: /var/lib/oncache
  flannel: /run/flannel
  toolsBin: /opt/oncache/bin
  toolsSbin: /opt/oncache/sbin

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

probes:
  enabled: false
  port: 9090

metrics:
  enabled: false
  port: 9090
  serviceType: ClusterIP
